<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>ORNATE-26 Flipbook</title>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }
    body {
      margin: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    
    /* Toolbar Controls */
    #controls {
      position: fixed;
      top: 15px;
      z-index: 1000;
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
    }
    .btn {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #555;
    }

    /* Zoomable Pan Viewport */
    #viewport {
      width: 100vw;
      height: calc(100vh - 60px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }
    #viewport:active {
      cursor: grabbing;
    }
    #book-wrapper {
      transform-origin: center center;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }

    .page {
      background: #111;
      width: 100%;
      height: 100%;
    }
    .page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Mobile optimization */
    @media (max-width: 768px) {
      #controls {
        top: auto;
        bottom: 15px;
      }
      #viewport {
        height: calc(100vh - 80px);
      }
    }
  </style>
</head>
<body>

<div id="controls">
  <button class="btn" id="zoom-in">+</button>
  <button class="btn" id="zoom-out">−</button>
  <button class="btn" id="reset-zoom">Reset</button>
</div>

<div id="viewport">
  <div id="book-wrapper">
    <div id="book"></div>
  </div>
</div>

<script>
  const totalPages = 140;
  const isMobile = window.innerWidth <= 768;

  // 1. Mobile Responsiveness Optimization
  const pageFlip = new St.PageFlip(document.getElementById('book'), {
    width: isMobile ? 360 : 480,
    height: isMobile ? 520 : 680,
    size: "stretch",
    minWidth: 280,
    maxWidth: 900,
    minHeight: 400,
    maxHeight: 1200,
    maxShadowOpacity: 0.5,
    showCover: true,
    usePortrait: true, // Forces single page display in vertical mobile orientations
    mobileScrollSupport: false
  });

  const pageElements = [];
  for (let i = 0; i < totalPages; i++) {
    const div = document.createElement('div');
    div.className = 'page';
    const img = document.createElement('img');
    img.src = `pages/Ornate 26-images-${i}.jpg`;
    img.alt = `Page ${i + 1}`;
    div.appendChild(img);
    pageElements.push(div);
  }
  pageFlip.loadFromHTML(pageElements);

  // 2. Zoom & Pan State Controller
  let scale = 1;
  let pointX = 0;
  let pointY = 0;
  let startX = 0;
  let startY = 0;
  let isDragging = false;

  const wrapper = document.getElementById('book-wrapper');
  const viewport = document.getElementById('viewport');

  function updateTransform() {
    wrapper.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
  }

  function setZoom(newScale) {
    scale = Math.min(Math.max(1, newScale), 3.5); // Min 1x, Max 3.5x zoom
    if (scale === 1) {
      pointX = 0;
      pointY = 0;
    }
    updateTransform();
  }

  // Button Controls
  document.getElementById('zoom-in').onclick = () => setZoom(scale + 0.3);
  document.getElementById('zoom-out').onclick = () => setZoom(scale - 0.3);
  document.getElementById('reset-zoom').onclick = () => setZoom(1);

  // Mouse Wheel Zoom
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const xs = (e.clientX - pointX) / scale;
    const ys = (e.clientY - pointY) / scale;
    const delta = e.deltaY < 0 ? 1.15 : 0.85;
    
    scale = Math.min(Math.max(1, scale * delta), 3.5);
    if (scale === 1) {
      pointX = 0;
      pointY = 0;
    }
    updateTransform();
  }, { passive: false });

  // Pan / Drag Functionality (Mouse & Touch)
  const startDrag = (x, y) => {
    if (scale > 1) {
      isDragging = true;
      startX = x - pointX;
      startY = y - pointY;
    }
  };

  const moveDrag = (x, y) => {
    if (isDragging && scale > 1) {
      pointX = x - startX;
      pointY = y - startY;
      updateTransform();
    }
  };

  const stopDrag = () => { isDragging = false; };

  viewport.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
  window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
  window.addEventListener('mouseup', stopDrag);

  // Touch Pinch & Pan Support
  let initialPinchDist = null;

  viewport.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      startDrag(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2) {
      isDragging = false;
      initialPinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  });

  viewport.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && scale > 1) {
      moveDrag(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2) {
      e.preventDefault();
      const currentDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      if (initialPinchDist) {
        const factor = currentDist / initialPinchDist;
        setZoom(scale * (factor > 1 ? 1.03 : 0.97));
      }
    }
  }, { passive: false });

  viewport.addEventListener('touchend', () => {
    stopDrag();
    initialPinchDist = null;
  });
</script>
</body>
</html>
