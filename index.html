<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipbook Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #container {
      width: 90vw;
      height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .page {
      background: white;
      width: 100%;
      height: 100%;
    }
    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

<div id="container">
  <div id="book"></div>
</div>

<script>
  const totalPages = 150; // Change this if your page count differs

  const pageFlip = new St.PageFlip(document.getElementById('book'), {
    width: 550,
    height: 733,
    size: "stretch",
    minWidth: 315,
    maxWidth: 1000,
    minHeight: 420,
    maxHeight: 1350,
    maxShadowOpacity: 0.5,
    showCover: true
  });

  const pageElements = [];

  for (let i = 1; i <= totalPages; i++) {
    const div = document.createElement('div');
    div.className = 'page';
    
    // Formats numbers as '001', '012', '150'
    const pageNum = String(i).padStart(3, '0'); 
    
    const img = document.createElement('img');
    img.src = `pages/page-${pageNum}.png`; // Ensure extension matches your file type (.png or .jpg)
    img.alt = `Page ${i}`;
    
    div.appendChild(img);
    pageElements.push(div);
  }

  pageFlip.loadFromHTML(pageElements);
</script>
</body>
</html>
